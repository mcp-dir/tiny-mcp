# Smithery configuration for Tiny (Olist Tiny)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_tiny

name: tiny-mcp
displayName: "Tiny (Olist Tiny)"
description: >
  ERP de e-commerce Tiny (Olist Tiny), um dos mais usados por lojas virtuais e sellers de marketplace no Brasil. Consulta produtos e estoque, pedidos de venda, contatos, notas fiscais e contas a pagar/receber, e cadastra contatos, via API oficial. Pareia com o Banco MCP pra conciliar pedidos e financeiro com o extrato. Autenticação por token (gerado na conta Tiny, na extensão Token API).

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/tiny-mcp
repository: https://github.com/mcp-dir/tiny-mcp

tags:
  - tiny
  - brazil
  - fin
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_tiny

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_tiny/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
